name: Cogni AI Architect Wrapper
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: User prompt
        required: false
        default: 'Hello from wrapper'

jobs:
  call-architect:
    permissions:
      actions: read
      contents: read
      discussions: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/cogni-ai-architect.lock.yml
    with:
      prompt: ${{ github.event.inputs.prompt || inputs.prompt }}
    secrets: inherit
