---
# Cogni AI Agent
# Triggered by /co, /cogni
name: Cogni AI Agent
description: Runs Cogni AI Architect, an elite autonomous engineering kernel and systems architect.
engine:
  id: copilot
on:
  slash_command:
    name: co
    events: [issue_comment, pull_request_comment]
permissions:
  actions: read
  discussions: read
  issues: read
  pull-requests: read
strict: false
jobs:
  init:
    runs-on: ubuntu-latest
    needs: [activation]
    steps:
      - name: Checkout cogni-ai-agents
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          git clone --depth 1 \
            -b ${{ inputs.version_agents || 'v1.0.0' }} \
            https://github.com/Cogni-AI-OU/cogni-ai-agents.git \
            ${{ runner.temp }}/.agents
      - name: Checkout cogni-ai-agent-instructions
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          git clone --depth 1 \
            -b ${{ inputs.version_instructions || 'v1.0.0' }} \
            https://github.com/Cogni-AI-OU/cogni-ai-agent-instructions.git \
            ${{ runner.temp }}/.instructions
      - name: Checkout cogni-ai-agent-skills
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          git clone --depth 1 \
            -b ${{ inputs.version_skills || 'v1.0.0' }} \
            https://github.com/Cogni-AI-OU/cogni-ai-agent-skills.git \
            ${{ runner.temp }}/.skills
  script:
    runs-on: ubuntu-latest
    needs: [activation]
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Script test
        uses: actions/github-script@v9
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const actor = context.actor;
            const isPR = !!context.payload.issue.pull_request;
            const contextType = isPR ? 'pull request' : 'issue';
            const sessionId = `${owner}-${repo}-${isPR ? 'pr' : 'issue'}${issueNumber}`;
tools:
  cli-proxy: true

---

Count to 10 and exit.
